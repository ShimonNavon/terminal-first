name: Build Mac installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install packaging tools
        run: python -m pip install -r Packaging/requirements.txt
      - name: Build universal Swift app
        run: bash Source/build.sh
      - name: Build installer
        run: python Packaging/build_dmg.py --output dist/Terminal-First-1.1.dmg
      - name: Verify installer contents
        run: |
          hdiutil attach dist/Terminal-First-1.1.dmg -nobrowse -readonly -mountpoint /tmp/terminal-first-verify
          trap 'hdiutil detach /tmp/terminal-first-verify' EXIT
          codesign --verify --deep --strict '/tmp/terminal-first-verify/Terminal First.app'
          lipo -verify_arch arm64 x86_64 '/tmp/terminal-first-verify/Terminal First.app/Contents/MacOS/TerminalFirst'
          test "$(readlink /tmp/terminal-first-verify/Applications)" = /Applications
          test -f '/tmp/terminal-first-verify/First Open.txt'
          test -f '/tmp/terminal-first-verify/.DS_Store'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Terminal-First-1.1-DMG
          path: dist/Terminal-First-1.1.dmg
          if-no-files-found: error
          retention-days: 30
